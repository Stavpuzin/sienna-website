<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sienna | Your Collection</title>
<meta name="description" content="Sienna Premium — private collection access">

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600&display=swap');

:root{
  --bg:#070707;--card:#121013;--card2:#191319;
  --pink:#ff3f9f;--pink2:#ff8bc9;--white:#fff;
  --muted:#aaa5aa;--line:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--white);font-family:"DM Sans",sans-serif}
a{color:inherit;text-decoration:none}
.nav{
  position:sticky;top:0;z-index:10;display:flex;align-items:center;
  justify-content:space-between;padding:18px 5%;
  background:rgba(7,7,7,.82);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.07)
}
.logo{font:italic 600 27px "Playfair Display",serif;letter-spacing:.08em}
.logo span{color:var(--pink)}
.back{font-size:13px;color:#ddd}
.back:hover{color:var(--pink2)}

main{max-width:1120px;margin:auto;padding:80px 6% 110px}
.hero{text-align:center;padding:30px 0 55px}
.kicker{color:var(--pink2);text-transform:uppercase;letter-spacing:.26em;font-size:11px}
h1,h2,h3{font-family:"Playfair Display",serif;font-weight:500}
h1{font-size:clamp(48px,9vw,92px);line-height:.95;margin:16px 0}
h1 i,h2 i{color:var(--pink)}
.subtitle{color:var(--muted);line-height:1.8;max-width:650px;margin:auto}

.notice{
  margin:0 auto 35px;max-width:720px;padding:14px 18px;border-radius:14px;
  border:1px solid rgba(255,63,159,.25);background:rgba(255,63,159,.06);
  color:#d8d2d8;font-size:13px;line-height:1.6;text-align:center
}

.collection{
  border:1px solid var(--line);border-radius:26px;padding:22px;
  background:linear-gradient(145deg,var(--card2),#0e0e10);
  box-shadow:0 25px 80px rgba(0,0,0,.3)
}
.collection-head{
  display:flex;justify-content:space-between;align-items:flex-end;
  gap:20px;margin-bottom:22px
}
.collection h2{font-size:36px;margin:8px 0}
.price{font-size:26px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

.asset{
  aspect-ratio:3/4;border-radius:18px;overflow:hidden;
  border:1px solid var(--line);background:#0b0b0d;
  position:relative;display:flex;align-items:center;justify-content:center
}
.asset img,.asset video{width:100%;height:100%;object-fit:cover;display:block}
.asset video{background:#000}
.empty{
  color:#777;text-align:center;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;padding:20px
}
.empty .lock{font-size:28px;margin-bottom:10px}

.footer{
  text-align:center;color:#777;font-size:13px;margin-top:55px;
  padding-top:30px;border-top:1px solid var(--line)
}

@media(max-width:760px){
  main{padding-top:55px}
  .collection-head{align-items:flex-start;flex-direction:column}
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:430px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<nav class="nav">
  <a class="logo" href="index.html">SIENNA<span>.</span></a>
  <a class="back" href="index.html">← Back to website</a>
</nav>

<main>
  <header class="hero">
    <div class="kicker">Private collection</div>
    <h1>Your <i>collection.</i></h1>
    <p class="subtitle">
      Thank you for your purchase. Your selected collection is shown below.
    </p>
  </header>

  <div id="notice" class="notice"></div>

  <section id="collection" class="collection">
    <div class="collection-head">
      <div>
        <div class="kicker">Sienna Premium</div>
        <h2 id="packageName">Collection</h2>
      </div>
      <div class="price" id="packagePrice"></div>
    </div>

    <div id="assets" class="grid"></div>
  </section>

  <footer class="footer">
    SIENNA • 2026
  </footer>
</main>

<script>
/*
  IMPORTANT:
  This page is a presentation layer only.

  Do NOT use the URL "?paid=1" as proof of payment.
  A real payment system must verify the PayPal transaction
  on a server/webhook before revealing private files.

  After your payment verification is connected, replace the
  asset URLs below with your protected/signed file URLs.
*/

const packages = {
  photos3: {
    name: "3 Photos",
    price: "$15",
    items: [
      {type:"image", title:"Photo 01", url:""},
      {type:"image", title:"Photo 02", url:""},
      {type:"image", title:"Photo 03", url:""}
    ]
  },

  photos5: {
    name: "5 Photos",
    price: "$25",
    items: [
      {type:"image", title:"Photo 01", url:""},
      {type:"image", title:"Photo 02", url:""},
      {type:"image", title:"Photo 03", url:""},
      {type:"image", title:"Photo 04", url:""},
      {type:"image", title:"Photo 05", url:""}
    ]
  },

  videos2: {
    name: "2 Videos",
    price: "$35",
    items: [
      {type:"video", title:"Video 01", url:""},
      {type:"video", title:"Video 02", url:""}
    ]
  },

  photos5videos2: {
    name: "5 Photos + 2 Videos",
    price: "$50",
    items: [
      {type:"image", title:"Photo 01", url:""},
      {type:"image", title:"Photo 02", url:""},
      {type:"image", title:"Photo 03", url:""},
      {type:"image", title:"Photo 04", url:""},
      {type:"image", title:"Photo 05", url:""},
      {type:"video", title:"Video 01", url:""},
      {type:"video", title:"Video 02", url:""}
    ]
  },

  vip: {
    name: "VIP • 7 Photos + 3 Videos",
    price: "$75",
    items: [
      {type:"image", title:"Photo 01", url:""},
      {type:"image", title:"Photo 02", url:""},
      {type:"image", title:"Photo 03", url:""},
      {type:"image", title:"Photo 04", url:""},
      {type:"image", title:"Photo 05", url:""},
      {type:"image", title:"Photo 06", url:""},
      {type:"image", title:"Photo 07", url:""},
      {type:"video", title:"Video 01", url:""},
      {type:"video", title:"Video 02", url:""},
      {type:"video", title:"Video 03", url:""}
    ]
  }
};

const params = new URLSearchParams(window.location.search);
const id = params.get("package") || "photos3";
const pkg = packages[id] || packages.photos3;

document.getElementById("packageName").textContent = pkg.name;
document.getElementById("packagePrice").textContent = pkg.price;

const notice = document.getElementById("notice");
const assets = document.getElementById("assets");

notice.textContent =
  "Payment verification must be completed before private files are displayed. " +
  "The placeholders below are ready for your protected content.";

pkg.items.forEach((item) => {
  const card = document.createElement("div");
  card.className = "asset";

  if (item.url) {
    if (item.type === "video") {
      const video = document.createElement("video");
      video.controls = true;
      video.preload = "metadata";
      video.src = item.url;
      video.setAttribute("aria-label", item.title);
      card.appendChild(video);
    } else {
      const img = document.createElement("img");
      img.src = item.url;
      img.alt = item.title;
      img.loading = "lazy";
      card.appendChild(img);
    }
  } else {
    card.innerHTML = `
      <div class="empty">
        <div class="lock">🔒</div>
        ${item.title}<br>
        Awaiting protected file
      </div>
    `;
  }

  assets.appendChild(card);
});
</script>

</body>
</html>
