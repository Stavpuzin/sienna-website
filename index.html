<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sienna | Premium</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080707;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 35px 20px 70px;
  text-align: center;
}

.logo {
  font-family: 'Playfair Display', serif;
  font-size: 42px;
  letter-spacing: 3px;
  margin-bottom: 8px;
}

.subtitle {
  color: #aaa;
  font-size: 15px;
  margin-bottom: 28px;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  margin: 10px 0;
}

.description {
  color: #c8c8c8;
  line-height: 1.7;
  max-width: 600px;
  margin: 0 auto 25px;
}

/* תמונת התצוגה */
.preview {
  width: 100%;
  max-width: 520px;
  margin: 25px auto;
  border-radius: 18px;
  overflow: hidden;
  position: relative;
  background: #111;
}

.preview img {
  width: 100%;
  display: block;
}

/* שכבת טשטוש/הסתרה */
.lock {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.25);
}

.lock-box {
  background: rgba(0,0,0,.75);
  padding: 18px 25px;
  border-radius: 14px;
  backdrop-filter: blur(8px);
}

.lock-box strong {
  display: block;
  font-size: 18px;
  margin-bottom: 5px;
}

.lock-box span {
  color: #bbb;
  font-size: 13px;
}

.price {
  font-size: 24px;
  margin: 25px 0 15px;
}

.button {
  display: inline-block;
  padding: 15px 38px;
  background: #fff;
  color: #000;
  text-decoration: none;
  border-radius: 30px;
  font-weight: 600;
  transition: .2s;
}

.button:hover {
  transform: scale(1.03);
}

.small {
  color: #777;
  font-size: 12px;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">SIENNA</div>

  <div class="subtitle">
    PREMIUM PRIVATE CONTENT
  </div>

  <h1>Welcome to my private world</h1>

  <div class="description">
    Exclusive photos, videos and private content.
    Access the full collection below.
  </div>

  <div class="preview">
    <img src="WhatsApp%20Image%202026-08-12%20at%2020.33.35.jpeg"
         alt="Sienna preview">

    <div class="lock">
      <div class="lock-box">
        <strong>🔒 Private Content</strong>
        <span>Unlock to see the full collection</span>
      </div>
    </div>
  </div>

  <div class="price">
    $25
  </div>

  <a class="button" href="YOUR-PAYMENT-LINK-HERE">
    Unlock Full Access
  </a>

  <div class="small">
    Secure payment • Instant access
  </div>

</div>

</body>
</html>
